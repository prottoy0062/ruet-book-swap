<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — RUET BookSwap</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html">RUET BookSwap</a>
  <nav id="nav-links"></nav>
</div>

<div class="container narrow">
  <h1>Create your account</h1>
  <p style="color:#5c554a;">Only @student.ruet.ac.bd emails can register.</p>

  <div class="card">

    <!-- Step 1: registration details -->
    <form id="register-form">
      <label for="name">Full name</label>
      <input type="text" id="name" required>

      <label for="email">RUET email</label>
      <input type="email" id="email" placeholder="you@student.ruet.ac.bd" required>

      <label for="department">Department</label>
      <input type="text" id="department" placeholder="e.g. CSE">

      <label for="year">Year</label>
      <input type="text" id="year" placeholder="e.g. 2nd">

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" placeholder="e.g. 01700000000">

      <button type="submit">Send verification code</button>
      <div class="error-text" id="register-error"></div>
    </form>

    <!-- Step 2: OTP entry (hidden until step 1 succeeds) -->
    <form id="otp-form" style="display:none;">
      <p class="success-text">A code was sent to your email. Enter it below.</p>
      <label for="otp">Verification code</label>
      <input type="text" id="otp" maxlength="6" required>
      <button type="submit">Verify & create account</button>
      <div class="error-text" id="otp-error"></div>
    </form>

  </div>
</div>

<script src="js/api.js"></script>
<script>
renderNav();

let pendingEmail = '';

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('register-error');
  errorBox.textContent = '';

  const payload = {
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    department: document.getElementById('department').value.trim(),
    year: document.getElementById('year').value.trim(),
    phone: document.getElementById('phone').value.trim(),
  };

  try {
    await apiCall('/auth/register', { method: 'POST', body: payload });
    pendingEmail = payload.email;
    document.getElementById('register-form').style.display = 'none';
    document.getElementById('otp-form').style.display = 'block';
  } catch (err) {
    errorBox.textContent = err.message;
  }
});

document.getElementById('otp-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('otp-error');
  errorBox.textContent = '';

  const otp = document.getElementById('otp').value.trim();

  try {
    const data = await apiCall('/auth/verify-otp', {
      method: 'POST',
      body: { email: pendingEmail, otp },
    });
    saveSession(data.token, data.user);
    window.location.href = 'index.html';
  } catch (err) {
    errorBox.textContent = err.message;
  }
});
</script>

</body>
</html>
