<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — RUET BookSwap</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html">RUET BookSwap</a>
  <nav id="nav-links"></nav>
</div>

<div class="container narrow">
  <h1>Welcome back</h1>
  <p style="color:#5c554a;">We'll email you a login code — no password needed.</p>

  <div class="card">

    <form id="login-form">
      <label for="email">RUET email</label>
      <input type="email" id="email" placeholder="you@student.ruet.ac.bd" required>
      <button type="submit">Send login code</button>
      <div class="error-text" id="login-error"></div>
    </form>

    <form id="otp-form" style="display:none;">
      <p class="success-text">A code was sent to your email. Enter it below.</p>
      <label for="otp">Login code</label>
      <input type="text" id="otp" maxlength="6" required>
      <button type="submit">Verify & log in</button>
      <div class="error-text" id="otp-error"></div>
    </form>

  </div>

  <p style="margin-top:16px;">New here? <a href="register.html">Create an account</a></p>
</div>

<script src="js/api.js"></script>
<script>
renderNav();

let pendingEmail = '';

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('login-error');
  errorBox.textContent = '';

  const email = document.getElementById('email').value.trim();

  try {
    await apiCall('/auth/login', { method: 'POST', body: { email } });
    pendingEmail = email;
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('otp-form').style.display = 'block';
  } catch (err) {
    errorBox.textContent = err.message;
  }
});

document.getElementById('otp-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('otp-error');
  errorBox.textContent = '';

  const otp = document.getElementById('otp').value.trim();

  try {
    const data = await apiCall('/auth/verify-otp', {
      method: 'POST',
      body: { email: pendingEmail, otp },
    });
    saveSession(data.token, data.user);
    window.location.href = 'index.html';
  } catch (err) {
    errorBox.textContent = err.message;
  }
});
</script>

</body>
</html>
